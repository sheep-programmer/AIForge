# AIForge 推荐入库的流行公开 skill 仓库
#
# 给 server/scripts/seed_skills.py 使用：
#   python server/scripts/seed_skills.py --from-file examples/popular-skills.yaml
#
# 你可以拷贝此文件并自行裁剪。每个条目都是一个独立的 GitHub 仓库。
#
# 字段：
#   url         (必填) 仓库 HTTPS URL
#   branch      (可选) 分支，默认 main
#   description (可选) 人类可读说明，仅供本文件参考

skills:
