  - url: https://github.com/pbakaus/impeccable
    branch: main
    description: Paul Bakaus 的 impeccable skill 集合

  - url: https://github.com/garrytan/gstack
    branch: main
    description: Garry Tan 的 gstack 工作流 skill

  - url: https://github.com/lijigang/ljg-skills
    branch: main
    description: lijigang 的中文 skill 整理

  - url: https://github.com/vercel-labs/skills
