# AIForge 反向代理示例
#
# 安装：
#   sudo cp examples/nginx.conf /etc/nginx/sites-available/aiforge
#   sudo ln -s /etc/nginx/sites-available/aiforge /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d aiforge.example.com   # 自动加 TLS server block
#   sudo nginx -t && sudo systemctl reload nginx
#
# 包含：
#   - TLS 终结（certbot 注入）
#   - Bearer 鉴权（在 nginx 层强制，server 自己也再校验一次纵深防御）
#   - 速率限制（防 ingest 接口被刷）
#   - WebSocket / SSE 透传

# ---- 限流 zones (在 /etc/nginx/nginx.conf 的 http {} 也可以放) ----
limit_req_zone $binary_remote_addr zone=aiforge_read:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=aiforge_write:10m rate=2r/s;

# ---- 80 → 443 跳转（certbot 通常会改写这部分） ----
server {
    listen 80;
    listen [::]:80;
    server_name aiforge.example.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiforge.example.com;

    # certbot 会自动填这两行
    ssl_certificate     /etc/letsencrypt/live/aiforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiforge.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 基础硬化
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # body 大小：ingest 不传二进制，128KB 绰绰有余
    client_max_body_size 128k;

    # 日志（生产里建议关 access_log 给 /v1/health，省磁盘）
    access_log /var/log/nginx/aiforge.access.log;
    error_log  /var/log/nginx/aiforge.error.log warn;

    # ---- 健康检查：公开，无限流 ----
    location = /v1/health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- 写操作：Bearer auth + 严格限流 ----
    # /v1/ingest, /v1/admin/*, DELETE /v1/skills/*
    location ~ ^/v1/(ingest|admin)(/|$) {
        # Bearer auth（如果你不想在 nginx 这层校验，删掉下面 3 行）
        if ($http_authorization != "Bearer REPLACE_ME_WITH_LONG_RANDOM") {
            return 401;
        }

        limit_req zone=aiforge_write burst=5 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # ingest 可能耗时（clone 大仓库）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ---- 读操作：限流但不强制 auth（默认放行 anonymous recommend） ----
    location /v1/ {
        limit_req zone=aiforge_read burst=60 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # recommend 自己 timeout 250ms，nginx 给 5s 余量足够
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 拒绝其他路径
    location / {
        return 404;
    }
}
