[project]
name = "aiforge"
version = "0.1.0"
description = "为 AI 编程 agent 而生的 skill 路由器：精准推荐、自动去重、本地兜底"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIForge contributors" }]
keywords = ["claude-code", "skills", "agent", "router", "rag", "skill-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "sqlite-vss>=0.1.2",
    "sentence-transformers>=3.3",
    "numpy>=2.0",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "pygithub>=2.5",
    "structlog>=24.4",
    "ulid-py>=1.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6",  # for HDBSCAN-like dedup clustering
    "anthropic>=0.40",  # optional reranker backend
    "alembic>=1.14",
    "pyyaml>=6.0",  # server/scripts/ 中的 seed / export / import 脚本
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[project.scripts]
aiforge-server = "aiforge.main:cli"
aiforge-mcp = "aiforge.gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "TID",          # tidy imports
    "RUF",          # ruff
]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vss.*", "sentence_transformers.*", "rank_bm25.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/aiforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
