name: 功能请求 / Feature request
description: 提议一个新功能或改进 / Propose a new feature or improvement
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        改动超过几行代码请先开 issue 讨论，避免 PR 被打回。
        Open an issue before sending a non-trivial PR to avoid wasted work.

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you trying to solve
      description: "**先讲问题，再讲方案。** / **Lead with the problem, not the solution.**"
      placeholder: |
        例：现在 /v1/recommend 只能返回固定 top-K，我想按 token 预算动态返回...
        e.g. /v1/recommend returns a fixed top-K; I want it to fit a token budget...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 可选——但越具体越容易讨论 / Optional but concrete proposals get traction faster.

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      placeholder: 你想过别的解法吗？为什么不选它？/ Did you consider other approaches? Why not?

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      multiple: true
      options:
        - server / API
        - server / recommender
        - server / ingestion
        - server / discovery
        - plugin
        - docs
        - CI / 打包
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意贡献吗？/ Willing to contribute?
      options:
        - label: 我愿意发 PR 实现这个 / I'm willing to send a PR
        - label: 我愿意帮忙测试 / I'm willing to help test
