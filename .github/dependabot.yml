# 依赖自动升级：每周一统一开 PR
# 配置说明：https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ─── Python 服务端 ───
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - server
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # sqlite-vss 是关键索引依赖，手动升级
      - dependency-name: sqlite-vss
      # sentence-transformers 大升级会换模型，需要手动 benchmark
      - dependency-name: sentence-transformers
        update-types: ["version-update:semver-major"]

  # ─── Next.js / Tailwind / 组件库 ───
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Next.js / React major 必须人工评估迁移
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions ───
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "UTC"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
