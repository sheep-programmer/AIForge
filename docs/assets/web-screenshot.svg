<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="AIForge Web 管理面板 · Dashboard">
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#F2F0EA"/>
    </linearGradient>
    <pattern id="ws-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="rgba(14,17,22,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="ws-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E5C4A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0E5C4A" stop-opacity="0"/>
    </linearGradient>
    <filter id="card-shadow"><feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.06"/></filter>
  </defs>

  <!-- 外框 -->
  <rect width="1280" height="760" fill="#FAFAF7"/>
  <rect width="1280" height="760" fill="url(#ws-grid)"/>

  <!-- 左侧 sidebar -->
  <g>
    <rect x="0" y="0" width="252" height="760" fill="#FCFBF8" stroke="#E6E4DC" stroke-width="1"/>

    <!-- logo + brand -->
    <g transform="translate(20 28)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#FCFBF8" stroke="#0E5C4A" stroke-width="1.5"/>
      <circle cx="11" cy="13" r="3.2" fill="#0E5C4A"/>
      <rect x="22.5" y="9.5" width="7" height="7" rx="1" fill="#1F3F6F" transform="rotate(45 26 13)"/>
      <rect x="10" y="22" width="16" height="5.5" rx="2.75" fill="none" stroke="#A26F1E" stroke-width="1.5"/>
      <text x="46" y="20" font-family="Fraunces, serif" font-size="18" font-weight="500" fill="#0E1116">AIForge</text>
      <text x="46" y="32" font-family="Inter, sans-serif" font-size="8" font-weight="500" letter-spacing="3" fill="#7E828B">CONTROL PLANE</text>
    </g>

    <line x1="0" y1="80" x2="252" y2="80" stroke="#E6E4DC"/>

    <!-- nav groups -->
    <g font-family="Inter, sans-serif" fill="#5F6470" font-size="13">
      <text x="20" y="108" font-size="9" letter-spacing="3" fill="#9CA3AF">OVERVIEW</text>
      <!-- active item: dashboard -->
      <rect x="12" y="120" width="228" height="44" rx="6" fill="#0E1116"/>
      <circle cx="32" cy="138" r="2.5" fill="#3FC79A"/>
      <text x="44" y="138" fill="#FCFBF8" font-weight="500">总览</text>
      <text x="44" y="154" font-size="10" fill="#B7BAC0">关键指标 / 最近活动</text>

      <text x="20" y="200" font-size="9" letter-spacing="3" fill="#9CA3AF">REGISTRY</text>
      <text x="44" y="226">Artifacts</text>
      <text x="44" y="240" font-size="10" fill="#9CA3AF">Skill / MCP / Plugin</text>
      <text x="44" y="266">分组标签</text>
      <text x="44" y="280" font-size="10" fill="#9CA3AF">人工 / 自动 标签</text>
      <text x="44" y="306">入库</text>
      <text x="44" y="320" font-size="10" fill="#9CA3AF">从 GitHub 拉取</text>
      <text x="44" y="346">自动打标</text>
      <text x="44" y="360" font-size="10" fill="#9CA3AF">小模型分类批处理</text>

      <text x="20" y="400" font-size="9" letter-spacing="3" fill="#9CA3AF">ROUTING</text>
      <text x="44" y="426">Playground</text>
      <text x="44" y="440" font-size="10" fill="#9CA3AF">推荐效果试验</text>
      <text x="44" y="466">审批队列</text>
      <text x="44" y="480" font-size="10" fill="#9CA3AF">远程发现的新仓库</text>
    </g>

    <!-- sidebar icons (geometric) -->
    <g stroke="#7E828B" fill="none" stroke-width="1.4">
      <rect x="22" y="130" width="12" height="12" rx="1.5" stroke="#3FC79A" stroke-width="1.6"/>
      <rect x="22" y="218" width="12" height="12" rx="1.5"/>
      <path d="M24 260 L34 270 M24 270 L34 260" stroke-linecap="round"/>
      <path d="M28 304 v8 M24 308 h8" stroke-linecap="round"/>
      <circle cx="28" cy="342" r="6"/>
      <circle cx="28" cy="422" r="2" fill="#7E828B"/>
      <path d="M22 462 L34 462 M28 458 v8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Topbar -->
  <g>
    <rect x="252" y="0" width="1028" height="56" fill="rgba(250,250,247,0.85)" stroke="#E6E4DC" stroke-width="1"/>
    <text x="278" y="35" font-family="Fraunces, serif" font-size="18" font-weight="500" fill="#0E1116">总览</text>

    <!-- ⌘K search -->
    <rect x="844" y="14" width="280" height="28" rx="6" fill="#FFFFFF" stroke="#E6E4DC"/>
    <circle cx="858" cy="28" r="4.5" fill="none" stroke="#7E828B"/>
    <line x1="862" y1="32" x2="866" y2="36" stroke="#7E828B"/>
    <text x="872" y="32" font-family="Inter, sans-serif" font-size="11" fill="#9CA3AF">搜索 artifact / 标签 / 仓库…</text>
    <rect x="1086" y="20" width="32" height="16" rx="3" fill="#F2F0EA"/>
    <text x="1102" y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#7E828B">⌘K</text>

    <!-- HealthPill -->
    <rect x="1140" y="14" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E6E4DC"/>
    <circle cx="1156" cy="28" r="3" fill="#1F7E64"/>
    <text x="1166" y="31" font-family="Inter, sans-serif" font-size="9" letter-spacing="2" fill="#3D424C">HEALTHY</text>
    <text x="1216" y="31" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F6470">312</text>
  </g>

  <!-- 主区 -->
  <g transform="translate(284 84)">
    <!-- PageHeader -->
    <text font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.5" fill="#7E828B">
      <tspan x="0" y="0" fill="#1F7E64">●</tspan>
      <tspan dx="6">CONTROL PLANE · LIVE</tspan>
    </text>
    <text x="0" y="48" font-family="Fraunces, serif" font-size="44" font-weight="350" letter-spacing="-1.2" fill="#0E1116">统揽你的 agent 工具箱</text>

    <!-- action buttons -->
    <g transform="translate(720 14)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#E6E4DC"/>
      <text x="60" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#0E1116">Playground</text>
      <rect x="132" y="0" width="120" height="34" rx="6" fill="#0E5C4A"/>
      <text x="192" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#FCFBF8" font-weight="500">+ 入库新仓库</text>
    </g>

    <!-- KPI tiles -->
    <g transform="translate(0 80)">
      <!-- tile 1 -->
      <g transform="translate(0 0)">
        <rect width="232" height="120" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
        <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">ARTIFACTS · 总量</text>
        <text x="14" y="62" font-family="Fraunces, serif" font-size="36" font-weight="350" fill="#0E1116">312</text>
        <text x="80" y="62" font-family="JetBrains Mono, monospace" font-size="11" fill="#9CA3AF">个</text>
        <!-- stacked bar -->
        <rect x="14" y="84" width="204" height="6" rx="3" fill="#F2F0EA"/>
        <rect x="14" y="84" width="120" height="6" rx="3" fill="#0E5C4A"/>
        <rect x="134" y="84" width="48" height="6" fill="#1F3F6F"/>
        <rect x="182" y="84" width="36" height="6" rx="3" fill="#A26F1E"/>
        <text x="14" y="106" font-family="Inter, sans-serif" font-size="9" fill="#5F6470">
          <tspan fill="#0E5C4A">●</tspan> skill 187 · <tspan fill="#1F3F6F">●</tspan> mcp 67 · <tspan fill="#A26F1E">●</tspan> plugin 58
        </text>
      </g>

      <!-- tile 2 -->
      <g transform="translate(252 0)">
        <rect width="232" height="120" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
        <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">标签覆盖</text>
        <text x="14" y="62" font-family="Fraunces, serif" font-size="36" font-weight="350" fill="#0E1116">27</text>
        <text x="55" y="62" font-family="JetBrains Mono, monospace" font-size="11" fill="#9CA3AF">个 tag</text>
        <rect x="14" y="80" width="44" height="16" rx="3" fill="#EAF3F0"/>
        <text x="36" y="91" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#0A4738">↑ 12.4%</text>
        <text x="14" y="108" font-family="Inter, sans-serif" font-size="9" fill="#5F6470">20 预置 · 7 自定义</text>
      </g>

      <!-- tile 3 -->
      <g transform="translate(504 0)">
        <rect width="232" height="120" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
        <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">累计推荐</text>
        <text x="14" y="62" font-family="Fraunces, serif" font-size="36" font-weight="350" fill="#0E1116">4.2k</text>
        <text x="63" y="62" font-family="JetBrains Mono, monospace" font-size="11" fill="#9CA3AF">次注入</text>
        <rect x="14" y="80" width="46" height="16" rx="3" fill="#EAF3F0"/>
        <text x="36" y="91" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#0A4738">↑ 28.7%</text>
        <text x="14" y="108" font-family="Inter, sans-serif" font-size="9" fill="#5F6470">过去 30 天</text>
      </g>

      <!-- tile 4 with reactor -->
      <g transform="translate(756 0)">
        <rect width="232" height="120" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
        <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">推理状态</text>
        <text x="14" y="62" font-family="Fraunces, serif" font-size="28" font-weight="350" fill="#0E1116">NOMINAL</text>
        <text x="14" y="92" font-family="Inter, sans-serif" font-size="9" fill="#5F6470">embedder 已加载 · reranker Qwen-1.5B</text>
        <!-- reactor -->
        <g transform="translate(200 80)">
          <circle cx="0" cy="0" r="22" fill="none" stroke="#0E1116" stroke-opacity="0.1"/>
          <circle cx="0" cy="0" r="22" fill="none" stroke="#3FC79A" stroke-width="1.5" stroke-dasharray="5 90"/>
          <circle cx="0" cy="0" r="6" fill="none" stroke="#0E5C4A"/>
          <circle cx="0" cy="0" r="2" fill="#0E5C4A"/>
        </g>
      </g>
    </g>

    <!-- Throughput chart -->
    <g transform="translate(0 224)">
      <rect width="608" height="248" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">推荐流量 · 过去 24 小时</text>

      <!-- baseline y grid -->
      <g stroke="rgba(14,17,22,0.06)" stroke-dasharray="2 4">
        <line x1="28" y1="80" x2="594" y2="80"/>
        <line x1="28" y1="120" x2="594" y2="120"/>
        <line x1="28" y1="160" x2="594" y2="160"/>
        <line x1="28" y1="200" x2="594" y2="200"/>
      </g>

      <!-- area data -->
      <path d="M28 200 L52 160 L76 140 L100 150 L124 110 L148 90 L172 130 L196 100 L220 70 L244 90 L268 60 L292 90 L316 70 L340 100 L364 80 L388 130 L412 110 L436 150 L460 130 L484 100 L508 70 L532 110 L556 130 L580 90 L594 100 L594 220 L28 220 Z"
            fill="url(#ws-area)"/>
      <path d="M28 200 L52 160 L76 140 L100 150 L124 110 L148 90 L172 130 L196 100 L220 70 L244 90 L268 60 L292 90 L316 70 L340 100 L364 80 L388 130 L412 110 L436 150 L460 130 L484 100 L508 70 L532 110 L556 130 L580 90 L594 100"
            fill="none" stroke="#0E5C4A" stroke-width="1.5"/>
      <!-- latency dashed line -->
      <path d="M28 90 L92 100 L156 84 L220 110 L284 96 L348 80 L412 102 L476 88 L540 110 L594 86"
            fill="none" stroke="#A26F1E" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- x labels -->
      <g font-family="JetBrains Mono, monospace" font-size="9" fill="#7E828B">
        <text x="28" y="235">00</text>
        <text x="160" y="235">06</text>
        <text x="294" y="235">12</text>
        <text x="430" y="235">18</text>
        <text x="566" y="235">24</text>
      </g>
    </g>

    <!-- 快速操作 -->
    <g transform="translate(628 224)">
      <rect width="356" height="248" rx="6" fill="#FFFFFF" stroke="#E6E4DC" filter="url(#card-shadow)"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#7E828B">快速操作</text>

      <g font-family="Inter, sans-serif" fill="#0E1116">
        <g transform="translate(14 36)">
          <rect width="328" height="48" rx="5" fill="#FAFAF7"/>
          <rect x="8" y="8" width="32" height="32" rx="4" fill="#0E1116"/>
          <path d="M20 18 v12 M14 24 h12" stroke="#FCFBF8" stroke-width="1.5" stroke-linecap="round" transform="translate(4 4)"/>
          <text x="52" y="22" font-size="13" font-weight="500">从 GitHub 入库</text>
          <text x="52" y="36" font-size="10" fill="#7E828B">粘贴仓库 URL · 自动识别类型</text>
        </g>
        <g transform="translate(14 92)">
          <rect width="328" height="48" rx="5" fill="#FAFAF7"/>
          <rect x="8" y="8" width="32" height="32" rx="4" fill="#0E1116"/>
          <circle cx="24" cy="24" r="5" stroke="#FCFBF8" stroke-width="1.5" fill="none"/>
          <path d="M28 28 L32 32" stroke="#FCFBF8" stroke-width="1.5"/>
          <text x="52" y="22" font-size="13" font-weight="500">让小模型自动打标</text>
          <text x="52" y="36" font-size="10" fill="#7E828B">复用 Qwen-1.5B · 串行批处理</text>
        </g>
        <g transform="translate(14 148)">
          <rect width="328" height="48" rx="5" fill="#FAFAF7"/>
          <rect x="8" y="8" width="32" height="32" rx="4" fill="#0E1116"/>
          <path d="M16 24 L20 28 L32 16" stroke="#FCFBF8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <text x="52" y="22" font-size="13" font-weight="500">试一次推荐</text>
          <text x="52" y="36" font-size="10" fill="#7E828B">输入 prompt 查看 top-K 注入预览</text>
        </g>
        <g transform="translate(14 204)">
          <text x="0" y="14" font-size="10" fill="#7E828B">查看全部 →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- LIVE FEED ticker -->
  <g transform="translate(0 720)">
    <rect width="1280" height="40" fill="rgba(250,250,247,0.92)" stroke="#E6E4DC"/>
    <g transform="translate(20 24)">
      <circle cx="0" cy="-2" r="2.5" fill="#0E5C4A"/>
      <text x="10" y="2" font-family="Inter, sans-serif" font-size="9" letter-spacing="2.5" fill="#5F6470">LIVE FEED</text>
    </g>
    <line x1="120" y1="6" x2="120" y2="34" stroke="#E6E4DC"/>
    <g transform="translate(140 24)" font-family="JetBrains Mono, monospace" font-size="10" fill="#5F6470">
      <text x="0" y="2"><tspan fill="#1F7E64">●</tspan>  推荐 · security-review →  <tspan fill="#1F7E64">●</tspan>  入库 · obra/superpowers-skills · +24 →  <tspan fill="#1F7E64">●</tspan>  推荐 · playwright-mcp →  <tspan fill="#1F7E64">●</tspan>  自动打标 · 17 项已处理</text>
    </g>
    <g transform="translate(1252 24)" text-anchor="end">
      <text font-family="JetBrains Mono, monospace" font-size="10" fill="#5F6470">14:23:08</text>
    </g>
  </g>
</svg>
