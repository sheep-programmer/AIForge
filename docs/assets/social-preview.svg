<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AIForge — Unified registry &amp; router for agent skills, MCP servers, and Claude Code plugins.">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#F2F0EA"/>
    </linearGradient>
    <linearGradient id="sp-stroke" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E5C4A"/>
      <stop offset="50%" stop-color="#1F7E64"/>
      <stop offset="100%" stop-color="#3FC79A"/>
    </linearGradient>
    <linearGradient id="sp-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#252932"/>
    </linearGradient>
    <pattern id="sp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(14,17,22,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="sp-dot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(14,17,22,0.10)"/>
    </pattern>
    <filter id="sp-glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <rect width="1280" height="640" fill="url(#sp-grid)"/>
  <rect x="800" y="0" width="480" height="640" fill="url(#sp-dot)"/>

  <line x1="0" y1="1" x2="1280" y2="1" stroke="#E6E4DC"/>
  <line x1="0" y1="639" x2="1280" y2="639" stroke="#E6E4DC"/>

  <!-- 大尺寸的 GitHub 社交预览：左侧 brand + 标题 + 副标题；右侧 mark + 几何符号 -->

  <text x="76" y="108" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="4" fill="#7E828B">CONTROL PLANE / v0.2 · OPEN SOURCE</text>

  <text x="76" y="248" font-family="Fraunces, Georgia, serif" font-size="156" font-weight="350" letter-spacing="-3" fill="url(#sp-ink)">AIForge</text>

  <!-- live dot -->
  <circle cx="490" cy="208" r="10" fill="#1F7E64">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="78" y="320" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#3D424C">
    <tspan>Unified registry &amp; router for agent</tspan>
  </text>
  <text x="78" y="360" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#3D424C">
    <tspan>skills, MCP servers, and Claude Code plugins.</tspan>
  </text>

  <text x="78" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#0E5C4A" font-weight="500">
    一个面板管 skill / MCP / plugin · 由小模型按需挑选
  </text>

  <!-- bullets row -->
  <g transform="translate(78 488)" font-family="JetBrains Mono, monospace" font-size="15" fill="#5F6470" letter-spacing="1">
    <g>
      <circle cx="6" cy="0" r="4" fill="#0E5C4A"/>
      <text x="20" y="5">skill · SKILL.md</text>
    </g>
    <g transform="translate(220 0)">
      <rect x="2" y="-4" width="8" height="8" fill="#1F3F6F" transform="rotate(45 6 0)"/>
      <text x="22" y="5">mcp · stdio / http / sse</text>
    </g>
    <g transform="translate(500 0)">
      <rect x="0" y="-5" width="16" height="10" rx="5" fill="none" stroke="#A26F1E" stroke-width="2"/>
      <text x="26" y="5">plugin · .claude-plugin/</text>
    </g>
  </g>

  <text x="78" y="568" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" fill="#7E828B">
    github.com/sheep-programmer/AIForge   ·   apache 2.0   ·   python 3.11+   ·   node 20+
  </text>

  <!-- 右侧 mark 大画面 -->
  <g transform="translate(900 110)">
    <rect x="0" y="0" width="320" height="420" rx="24" fill="#FFFFFF" stroke="url(#sp-stroke)" stroke-width="2"/>

    <!-- 上部 instrument labels -->
    <text x="22" y="34" font-family="JetBrains Mono, monospace" font-size="11" fill="#7E828B" letter-spacing="3">REGISTRY · TOP-K</text>

    <!-- 仪表刻度 -->
    <g stroke="#0E1116" stroke-opacity="0.12">
      <line x1="20" y1="48" x2="60" y2="48" stroke-width="1"/>
      <line x1="20" y1="58" x2="48" y2="58"/>
      <line x1="20" y1="68" x2="48" y2="68"/>
      <line x1="20" y1="78" x2="48" y2="78"/>
      <line x1="20" y1="88" x2="60" y2="88" stroke-width="1"/>
    </g>

    <!-- 三符号 -->
    <g transform="translate(160 220)" filter="url(#sp-glow)" opacity="0.18">
      <circle cx="-80" cy="0" r="32" fill="#0E5C4A"/>
      <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#1F3F6F" transform="rotate(45)"/>
      <rect x="48" y="-16" width="64" height="32" rx="16" fill="none" stroke="#A26F1E" stroke-width="4"/>
    </g>

    <g transform="translate(160 220)">
      <!-- skill -->
      <circle cx="-80" cy="0" r="30" fill="#0E5C4A"/>
      <circle cx="-80" cy="0" r="9" fill="#FCFBF8"/>
      <text x="-80" y="64" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6470" letter-spacing="2">SKILL</text>

      <!-- mcp -->
      <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#1F3F6F" transform="rotate(45)"/>
      <rect x="-6" y="-6" width="12" height="12" fill="#FCFBF8" transform="rotate(45)"/>
      <text x="0" y="64" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6470" letter-spacing="2">MCP</text>

      <!-- plugin -->
      <rect x="50" y="-16" width="60" height="32" rx="16" fill="none" stroke="#A26F1E" stroke-width="4"/>
      <rect x="62" y="-8" width="36" height="16" rx="8" fill="#A26F1E"/>
      <text x="80" y="64" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6470" letter-spacing="2">PLUGIN</text>
    </g>

    <!-- 下部信息条 -->
    <line x1="20" y1="340" x2="300" y2="340" stroke="#E6E4DC"/>
    <text x="20" y="368" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6470" letter-spacing="2">
      <tspan fill="#1F7E64">●</tspan> qwen-1.5b reranker  ·  384-dim embed
    </text>
    <text x="20" y="392" font-family="JetBrains Mono, monospace" font-size="11" fill="#5F6470" letter-spacing="2">
      <tspan fill="#A26F1E">●</tspan> 20 builtin tags  ·  auto-classify
    </text>
  </g>
</svg>
